[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpc-dsk"
version = "0.1.0"
description = "Éditeur de disquettes virtuelles .dsk (format ADF) et d'images USB Gotek pour Amstrad CPC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christophe" }]
keywords = ["amstrad", "cpc", "dsk", "adf", "gotek", "retro"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
cpc-dsk = "cpc_dsk.cli:main"

[tool.setuptools.packages.find]
include = ["cpc_dsk*"]

[tool.setuptools.package-data]
cpc_dsk = ["fonts/*", "data/*.bin", "icon.ico", "icon.png"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
